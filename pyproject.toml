[project]
name = "reelforge"
version = "0.1.0"
description = "Fully automated batch AI video pipeline: music-first beat grids, prompt recipes, scored review loops, fal.ai generation, ffmpeg beat-synced assembly."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
reelforge = "reelforge.runner:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reelforge"]
